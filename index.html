<!doctype html>
<html lang="es-AR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torcuato Beach Seven</title>
<meta name="description" content="Fixture, resultados, tablas, agenda y mapa del Torcuato Beach Seven en Hindú Club.">
<meta name="theme-color" content="#13254F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,800;1,800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one narrow phone column, scoreboard header band, sticky sport chips, fixed bottom tab bar */
:root{
  --bg:#F6F5F0; --surface:#FFFFFF; --ink:#13254F; --muted:#5B6787; --line:#E3E1D8;
  --sea:#1D4590; --sea-soft:#E4EBF7; --sun:#E9B800; --band:#13254F; --band-ink:#FFFFFF;
  --navy:#13254F; --navy-2:#0D1B3D; --gold:#F5C518; --sky:#5BB8F0; --gold-soft:#FBF1C7;
  --live:#D93F27; --good:#1E8449; --bad:#B9382A;
  --brand-blue:#2BB9E2; --brand-orange:#F5A61A;
  --display:"Poppins","Segoe UI",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1430; --surface:#12224A; --ink:#EEF2FB; --muted:#9AA8C8; --line:#22346A;
  --sea:#6FA4FF; --sea-soft:#1A2B5A; --sun:#FFD23F; --band:#0E1A3D; --band-ink:#FFFFFF;
  --navy:#0E1A3D; --navy-2:#081128; --gold:#FFD23F; --sky:#5BB8F0; --gold-soft:#2E2A12;
  --live:#F06A50; --good:#4CC27E; --bad:#F07E6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1430; --surface:#12224A; --ink:#EEF2FB; --muted:#9AA8C8; --line:#22346A;
  --sea:#6FA4FF; --sea-soft:#1A2B5A; --sun:#FFD23F; --band:#0E1A3D; --band-ink:#FFFFFF;
  --navy:#0E1A3D; --navy-2:#081128; --gold:#FFD23F; --sky:#5BB8F0; --gold-soft:#2E2A12;
  --live:#F06A50; --good:#4CC27E; --bad:#F07E6E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header band */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:16px 14px;display:grid;gap:10px}
.stripe{height:8px;background:linear-gradient(var(--sky) 0 50%,var(--gold) 50%)}
.hype{position:relative;overflow:hidden;background:var(--navy-2);border-top:1px solid rgba(255,255,255,.08)}
.hype .wrap{position:relative;padding-block:12px 10px;text-align:center}
.hype svg{position:relative;z-index:1;display:block;width:100%;max-width:520px;height:auto;margin:0 auto;overflow:visible}
.hype text{font-family:"Barlow Condensed","Arial Narrow",var(--display);font-weight:800;font-size:64px;fill:var(--gold);filter:drop-shadow(0 0 10px rgba(245,197,24,.35))}
.hype::before{content:"";position:absolute;top:-60%;bottom:-60%;left:-30%;width:45%;background:radial-gradient(closest-side,rgba(245,197,24,.55),rgba(245,197,24,0));filter:blur(4px);animation:hypeglow 7s ease-in-out infinite alternate}
@keyframes hypeglow{from{transform:translateX(0)}to{transform:translateX(240%)}}
@media (prefers-reduced-motion:reduce){.hype::before{animation:none;left:-5%}}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{width:min(220px,58vw);height:auto;display:block;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.side{display:grid;justify-items:end;gap:6px;text-align:right}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.count{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.15;color:#fff}
.count b{color:var(--gold);font-weight:800;font-size:26px;display:block;line-height:1}
.upd{font-size:12px;color:rgba(255,255,255,.6)}
.edit-toggle{border:1.5px solid var(--gold);background:transparent;border-radius:10px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--gold)}
.edit-toggle[aria-pressed="true"]{background:var(--gold);color:var(--navy-2);border-color:var(--gold)}
.notice{background:var(--gold-soft);color:var(--ink);font-size:13px}
.notice .wrap{padding-block:8px}

/* chips */
.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.chips .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--gold);border-color:var(--navy)}

main .wrap{padding-block:14px 24px;display:grid;gap:18px}
.sec-title{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:16px;letter-spacing:.04em;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0}
.stack{display:grid;gap:8px}
.muted{color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}

/* match card */
.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;text-align:left;width:100%}
button.match{cursor:pointer}
.match.live{border-color:var(--live);box-shadow:inset 3px 0 0 var(--live)}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.m-top span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.m-team{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-team.ph{color:var(--muted);font-weight:500;font-style:italic}
.m-team.win{font-weight:700}
.m-score{font-family:var(--display);font-weight:800;font-size:21px;line-height:1;min-width:30px;text-align:right}
.m-score.lose{opacity:.45}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:none}
.tag.live{background:var(--live);color:#fff}
.tag.fin{background:var(--line);color:var(--ink)}
.tag.prog{border:1px solid var(--line);color:var(--muted)}
.tag.comp{background:var(--sea-soft);color:var(--sea)}
.pulse{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* standings */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:center;white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.team,th.team{text-align:left;overflow:hidden;text-overflow:ellipsis;font-weight:600}
td.pos{width:26px;color:var(--muted);font-weight:700;position:relative}
tr.q td.pos{color:var(--sea)}
tr.q td.pos::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--sea)}
td.pts{font-family:var(--display);font-weight:800;font-size:15px}
.grp-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 0}
.grp-head b{font-family:var(--display);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.legend{font-size:12px;color:var(--muted)}

/* standings fit on phones */
.tbl-wrap table{table-layout:fixed}
.tbl-wrap col.c-pos{width:30px} .tbl-wrap col.c-n{width:30px} .tbl-wrap col.c-d{width:38px} .tbl-wrap col.c-p{width:38px} .tbl-wrap col.c-x{width:36px}
td.team{overflow:hidden;text-overflow:ellipsis}

/* fixture subtabs */
.subtabs{background:var(--surface);border:1px solid var(--line)}
.subtabs button{display:flex;align-items:center;justify-content:center;gap:6px}
.seg.subtabs button[aria-pressed="true"]{background:var(--navy);color:var(--gold);box-shadow:none}
.subtabs .cnt{font-size:12px;opacity:.75}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite}
/* team matches in table */
tr.trow{cursor:pointer}
tr.trow:hover td,tr.trow.open td{background:var(--sea-soft)}
tr.trow.open td{border-bottom:0}
.chev{margin-left:6px;font-size:10px;color:var(--muted)}
tr.tm-row td{padding:0 10px 10px;background:var(--sea-soft);white-space:normal;text-align:left}
.tm{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.tm-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 0 2px}
.tm-l{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.tm-t + .tm-l{border-top:0}
.tm-o{min-width:0;font-weight:600;display:block}
.tm-o .ph{color:var(--muted);font-style:italic;font-weight:500}
.tm-o small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.tm-l b{font-family:var(--display);font-weight:800;font-size:15px}
.tm-r{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.tm-r.w{background:var(--good)} .tm-r.l{background:var(--bad)} .tm-r.d{background:var(--muted)} .tm-r.live{background:var(--live);font-size:10px}
.tm-h{font-size:12px;font-weight:700;color:var(--muted);min-width:26px}

/* agenda */
.agenda{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ag{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.ag:last-child{border-bottom:0}
.ag-h{font-family:var(--display);font-weight:700;font-size:16px}
.ag-t{font-weight:600;min-width:0}
.ag-l{font-size:13px;color:var(--muted)}
.ag.now{background:var(--sea-soft)}
.ag.past{opacity:.55}

/* map */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.mapbox svg{width:100%;height:auto;display:block;max-width:100%}
.zone rect{stroke:var(--bg);stroke-width:.8}
.zone text{font-family:var(--display);font-weight:800;fill:var(--ink);pointer-events:none}
.zone .zn{font-size:3.8px}
.zone .zl{font-size:3.2px;font-family:var(--body);font-weight:600}
.zone.sel rect{stroke:var(--ink);stroke-width:1.2}
.z-cancha{fill:color-mix(in srgb,var(--good) 32%,var(--surface))}
.z-serv{fill:color-mix(in srgb,var(--muted) 22%,var(--surface))}
.z-info{fill:color-mix(in srgb,var(--sea) 30%,var(--surface))}
.z-salud{fill:color-mix(in srgb,var(--bad) 28%,var(--surface))}
.z-comida{fill:color-mix(in srgb,var(--sun) 40%,var(--surface))}
.z-show{fill:color-mix(in srgb,var(--sun) 25%,var(--surface))}
.z-fiesta{fill:color-mix(in srgb,var(--sea) 50%,var(--surface))}
.zlist{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.zlist button{display:flex;gap:8px;align-items:center;background:none;border:0;padding:4px 0;text-align:left}
.zlist i{width:20px;height:20px;flex:none;display:block;font-style:normal}
.link{color:var(--sea);font-weight:600}

/* crests */
.crest{width:1.25em;height:1.25em;object-fit:contain;vertical-align:-.25em;margin-right:.4em;flex:none}
.crest-btn{width:34px;height:34px;border-radius:8px;border:1px dashed var(--line);background:var(--bg);display:grid;place-items:center;font-size:18px;color:var(--muted);padding:0;flex:none}
.crest-btn img{width:28px;height:28px;object-fit:contain}
.li.wc{grid-template-columns:auto 1fr auto}

/* event map */
.mapwrap{position:relative;container-type:inline-size;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0b2a44}
.mapwrap img{display:block;width:100%;height:auto;max-width:100%;user-select:none;-webkit-user-drag:none}
.mlab{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));font-family:var(--display);font-weight:700;font-size:2.35cqw;line-height:1.1;padding:.35em .7em;border-radius:.55em;text-align:center;white-space:nowrap;box-shadow:0 .2em .6em rgba(0,0,0,.4);border:0;cursor:pointer;user-select:none}
.mlab small{display:block;font-weight:600;font-size:.78em;opacity:.85}
.mlab.l{background:#FFFFFF;color:#0B2A44}
.mlab.d{background:#12324F;color:#FFFFFF}
.mlab.o{background:#F5A61A;color:#1B1200}
.mlab.sel{outline:.3em solid #F5A61A;outline-offset:.1em}
.mapwrap.editing .mlab{touch-action:none;outline:.14em dashed rgba(255,255,255,.9);outline-offset:.12em;cursor:grab}
.mapwrap.placing{cursor:crosshair}
.mapwrap.placing::after{content:"Tocá el mapa donde va el recuadro";position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#F5A61A;color:#1B1200;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}

/* admin */
.tabs2{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs2 button{flex:1 0 auto;white-space:nowrap;padding-inline:10px;border:0;background:none;border-radius:7px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--navy);color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;min-width:0}
.kpi span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi b{font-family:var(--display);font-weight:700;font-size:clamp(14px,4.2vw,19px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.pos b{color:var(--good)} .kpi.neg b{color:var(--bad)}
.panel-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.row2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.row2 b{font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);border-radius:5px}
.bars{display:grid;gap:8px}
.bars .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li-main{background:none;border:0;padding:0;text-align:left;min-width:0;display:grid;gap:2px}
.li-t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-r{text-align:right;display:grid;gap:3px;justify-items:end}
.amt{font-variant-numeric:tabular-nums;font-weight:700}
.amt.in{color:var(--good)} .amt.out{color:var(--bad)}
.pill{border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.mid{background:color-mix(in srgb,var(--sea) 18%,transparent);color:var(--sea)}
.pill.no{background:color-mix(in srgb,var(--sun) 28%,transparent);color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.ghost{background:none}
.btn.block{width:100%}
.ex{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 5px;margin-left:6px}

/* pending bar */
.pend{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:7;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.pend-in{max-width:536px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.pend-in span{flex:1;font-size:14px;font-weight:600}
.pend-in button{border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}
.pend-in .pub{background:var(--gold);color:var(--navy-2)}
.pend-in .disc{background:transparent;color:var(--bg);opacity:.8}

/* footer */
.foot .wrap{padding-block:8px 110px;display:flex;gap:10px;justify-content:center;align-items:center;font-size:13px;color:var(--muted)}
.link-btn{background:none;border:0;color:var(--sea);font-weight:600;font-size:13px;padding:6px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--navy);border-top:4px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:rgba(255,255,255,.62);letter-spacing:.02em}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--gold)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(5,15,18,.5)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh-head h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:18px;margin:0;letter-spacing:.02em}
.icon-btn{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
form{display:grid;gap:12px}
.fld{display:grid;gap:4px}
.fld label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 11px;font-size:16px}
.fld textarea{min-height:92px;resize:vertical}
.fld.tg{grid-template-columns:1fr auto;align-items:center}
.fld.tg input{width:22px;height:22px;accent-color:var(--sea)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px}
.sh-actions .primary{flex:1}
.sc-team{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.sc-team:last-of-type{border-bottom:0}
.sc-name{font-weight:700;font-size:17px}
.sc-ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sc-ctrl input{width:80px;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:4px}
.sc-ctrl button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-width:46px;height:46px;font-weight:700;font-size:16px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}

let BASE = SEED, hasRow = false;
const DKEY = 'tb7s-draft';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h >>> 0); };
const money = new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS', maximumFractionDigits:0});
const $$ = n => money.format(Number(n) || 0);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------- draft (unpublished public changes) ---------- */
let draft = store.get(DKEY);
if (!draft) draft = {m:{}, sec:{}, grp:{}};
function applyDraft(base, d){
  const s = clone(base);
  for (const [id, m] of Object.entries(d.m || {})) {
    const i = s.partidos.findIndex(x => x.id === id);
    if (m === null) { if (i >= 0) s.partidos.splice(i, 1); }
    else if (i >= 0) s.partidos[i] = m; else s.partidos.push(m);
  }
  for (const [k, v] of Object.entries(d.sec || {})) s[k] = v;
  for (const [cid, g] of Object.entries(d.grp || {})) { const c = s.comps.find(x => x.id === cid); if (c) c.grupos = g; }
  return s;
}
const pendingCount = () => Object.keys(draft.m).length + Object.keys(draft.sec).length + Object.keys(draft.grp).length;

const compById = id => S.comps.find(c => c.id === id);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
function crestId(name){ const E = S.escudos || {}; const k = norm(name); for (const n in E) if (norm(n) === k) return E[n]; return null; }
function crestSrc(v){ return !v ? '' : /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(v) ? v : /^[0-9a-f]{32}$/.test(v) ? '/_blob/' + v : ''; }
const GEN_STOP = new Set(['de','del','la','las','el','los','fc','f.c','club','cf','team','y','the','hc','rc']);
const GEN_FILL = ['#13254F','#1D4590','#2B7DBF','#1E6B52','#A3322A','#5B3A8F','#B86A00','#0F6E78'];
function genInitials(name){
  const w = String(name).replace(/[()"'.]/g, ' ').split(/[\s\-_/]+/).filter(Boolean);
  const k = w.filter(x => !GEN_STOP.has(x.toLowerCase()));
  const use = k.length ? k : w;
  if (!use.length) return '?';
  if (use.length === 1) return /^\d+$/.test(use[0]) ? use[0].slice(0, 3) : use[0].slice(0, 2).toUpperCase();
  return use.slice(0, 3).map(x => /^\d+$/.test(x) ? x : x[0]).join('').toUpperCase().slice(0, 3);
}
const genCache = {};
function genCrest(name){
  if (genCache[name]) return genCache[name];
  let h = 0; for (const ch of norm(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const fill = GEN_FILL[h % GEN_FILL.length], ini = genInitials(name), fs = ini.length > 2 ? 15 : 19;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 46"><path d="M20 2 L37 7 V22 C37 33 29 40 20 44 C11 40 3 33 3 22 V7 Z" fill="${fill}" stroke="#F5C518" stroke-width="2.6" stroke-linejoin="round"/><path d="M8 11 H32" stroke="#5BB8F0" stroke-width="2"/><text x="20" y="${ini.length > 2 ? 30 : 31}" text-anchor="middle" font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" font-size="${fs}" fill="#FFFFFF">${ini.replace(/[<&>]/g, '')}</text></svg>`;
  return (genCache[name] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
}
function crestFor(name, comp){ const s = crestSrc(crestId(name)); if (s) return s; return comp && comp !== 'rugby' ? genCrest(name) : ''; }
function crest(name, comp){ const s = crestFor(name, comp); return s ? `<img class="crest" src="${s}" alt="">` : ''; }
function standings(c, g){
  const rows = {};
  g.equipos.forEach(t => rows[t] = {t, pj:0, g:0, e:0, p:0, pf:0, pc:0, pts:0});
  S.partidos.filter(m => m.c === c.id && m.g === g.id && m.e === 'final' && m.gl != null && m.gv != null).forEach(m => {
    const a = rows[m.l], b = rows[m.v]; if (!a || !b) return;
    a.pj++; b.pj++; a.pf += m.gl; a.pc += m.gv; b.pf += m.gv; b.pc += m.gl;
    if (m.gl > m.gv) { a.g++; b.p++; a.pts += c.pts.g; b.pts += c.pts.p; }
    else if (m.gl < m.gv) { b.g++; a.p++; b.pts += c.pts.g; a.pts += c.pts.p; }
    else { a.e++; b.e++; a.pts += c.pts.e; b.pts += c.pts.e; }
  });
  return Object.values(rows).sort((x,y) => y.pts - x.pts || (y.pf-y.pc) - (x.pf-x.pc) || y.pf - x.pf || x.t.localeCompare(y.t));
}
function groupDone(c, gid){
  const ms = S.partidos.filter(m => m.c === c.id && m.g === gid);
  return ms.length > 0 && ms.every(m => m.e === 'final');
}
function resolveName(cid, name){
  const mt = /^(\d+)° ?([A-Z0-9]+)$/.exec(name || '');
  if (!mt) return {n:name, ph:/^(Ganador|Perdedor)/.test(name || '')};
  const c = compById(cid), g = c && c.grupos.find(x => x.id === mt[2]);
  if (!g || !groupDone(c, g.id)) return {n:name, ph:true};
  const r = standings(c, g)[Number(mt[1]) - 1];
  return r ? {n:r.t, ph:false} : {n:name, ph:true};
}

function totals(){

  const fq = A.fiesta.reduce((s,x) => s + (+x.cantidad || 0), 0);

  const mi = A.caja.filter(x => x.tipo === 'Ingreso').reduce((s,x) => s + (+x.monto || 0), 0);
  const mo = A.caja.filter(x => x.tipo === 'Egreso').reduce((s,x) => s + (+x.monto || 0), 0);

async function fixUrba2026(){

    const {error:e0} = await sb.from('adm_docs').upsert({col:'adm', id:'convfix_urba2026', data:{at:new Date().toISOString()}}); if (e0) return;
    const pool = A.conv.filter(x => URBA_Z.includes(x.zona)); const used = new Set(); const rows = [];
    URBA_2026.forEach((u, i) => {
      const keys = [u.club].concat(u.al).map(norm);
      const hit = pool.find(x => !used.has(x.id) && keys.includes(norm(x.club)));
      if (hit) { used.add(hit.id); const d = Object.assign({}, hit, {club:u.club, zona:u.zona, prov:u.prov}); delete d.id; rows.push({col:COL.conv, id:hit.id, data:d}); }
      else rows.push({col:COL.conv, id:'u26-' + i, data:{club:u.club, zona:u.zona, prov:u.prov, cont:false, estado:'Pendiente', com:'', integ:null, aloj:'No', resp:'', tel:'', dep:'rugby'}});
    });
    pool.filter(x => !used.has(x.id)).forEach(x => { const d = Object.assign({}, x, {zona:'URBA resto', prov:'Otra categoría (revisar)'}); delete d.id; rows.push({col:COL.conv, id:x.id, data:d}); });
    const {error} = await sb.from('adm_docs').upsert(rows); if (error) throw error;
    toast('Convocatoria: categorías URBA 2026 actualizadas'); await loadAdmin();
  } catch (e) {}
}

}

async function fixArand(){
  try {
    const {error:e0} = await sb.from('adm_docs').upsert({col:'adm', id:'fix_arand', data:{at:new Date().toISOString()}}); if (e0) return;
    const {data:row} = await sb.from('tb_state').select('data').eq('id', 1).maybeSingle();
    const st = clone(row && row.data ? row.data : BASE), OLD = 'Jockey Rosario', NEW = 'Aranduroga';
    const sw = s => s === OLD ? NEW : s;
    st.comps.forEach(c => c.grupos.forEach(g => { g.equipos = g.equipos.map(sw); }));
    st.partidos.forEach(m => { m.l = sw(m.l); m.v = sw(m.v); });
    st.escudos = st.escudos || {};
    if (!Object.keys(st.escudos).some(k => norm(k) === norm(NEW))) st.escudos[NEW] = ARAND_CREST;
    const {error} = await sb.from('tb_state').upsert({id:1, data:st, updated_at:new Date().toISOString()});
    if (!error) setBase(st);
  } catch (e) {}
}
async function seedConv(){
  toast('Cargando clubes…');
  try {
    const rows = CONV_SEED.map((d, i) => ({col:COL.conv, id:'c' + String(i).padStart(3, '0'), data:Object.assign({dep:'rugby', resp:'', tel:''}, d)}));
    const {error} = await sb.from('adm_docs').upsert(rows); if (error) throw error;
    await loadAdmin(); toast(rows.length + ' clubes cargados');
  } catch (e) { toast('No se pudo cargar la lista.'); }
}
async function conv2eq(x){

  catch (e) { toast('No se pudo pasar a Equipos.'); }
}
function admFiesta(){
  const list = A.fiesta.slice().sort((a,b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const t = totals();
  const byMedio = {}; list.forEach(x => byMedio[x.medio || 'Otro'] = (byMedio[x.medio || 'Otro'] || 0) + (+x.cantidad || 0) * (+x.precio || 0));
  return `<div class="kpis"><div class="kpi"><span>Vendidas</span><b class="num">${t.fq}</b></div><div class="kpi"><span>Quedan</span><b class="num">${Math.max(0, (+A.cfg.capacidad || 0) - t.fq)}</b></div><div class="kpi pos"><span>Recaudado</span><b class="num">${$$(t.fi)}</b></div></div>
  <div class="toolbar"><button class="btn primary" data-act="newfiesta">+ Registrar venta</button><button class="btn ghost" data-act="csv" data-id="fiesta">Exportar CSV</button></div>
  ${list.length ? `<div class="list">${list.map(x => `<div class="li"><button class="li-main" data-act="editfiesta" data-id="${x.id}"><span class="li-t">${esc(x.nombre)}${exTag(x)}</span><span class="li-s">${esc(x.cantidad)} × ${$$(x.precio)} · ${esc(x.medio)}${x.tanda ? ' · ' + esc(x.tanda) : ''}${x.vendedor ? ' · vendió ' + esc(x.vendedor) : ''}</span></button><div class="li-r"><span class="amt in">${$$((+x.cantidad || 0) * (+x.precio || 0))}</span><span class="li-s">${esc(fmtDate(x.fecha))}</span></div></div>`).join('')}</div>
  <div class="panel-card"><h2 class="sec-title">Por medio de pago</h2>${barList(byMedio)}</div>` : '<div class="empty">Sin ventas registradas. Cargá cada venta con <b>Registrar venta</b>.</div>'}`;
}
function admCaja(){

const app = $('#app');
function render(){
  const tabs = [['fixture','Fixture'],['tabla','Tabla'],['agenda','Agenda'],['mapa','Mapa']].concat(isAdmin ? [['admin','Admin']] : []);
  if (tab === 'admin' && !isAdmin) tab = 'fixture';
  if (!compById(comp)) comp = S.comps[0].id;
  let v = '';
  if (tab === 'fixture') v = viewFixture(); else if (tab === 'tabla') v = viewTabla(); else if (tab === 'agenda') v = viewAgenda(); else if (tab === 'mapa') v = viewMapa(); else v = viewAdmin();
  const n = pendingCount();
  app.innerHTML = header() + ((tab === 'fixture' || tab === 'tabla') ? chips(false) : '') +
    `<main><div class="wrap">${v}</div></main>` +
    (isAdmin && n ? `<div class="pend"><div class="pend-in"><span>${n} ${n === 1 ? 'cambio' : 'cambios'} sin publicar</span><button class="disc" data-act="discard" id="discard">Descartar</button><button class="pub" data-act="publish">Publicar</button></div></div>` : '') +
    `<footer class="foot"><div class="wrap">${me ? `<span>${esc(me.email)}</span><button class="link-btn" data-act="logout">Salir</button>` : '<button class="link-btn" data-act="login">Acceso organización</button>'}</div></footer>` +

}

/* ---------- toast & sheet ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const sheet = $('#sheet'), panel = sheet.querySelector('.panel');
let formCtx = null, scoreCtx = null;
function closeSheet(){ sheet.hidden = true; panel.innerHTML = ''; formCtx = null; scoreCtx = null; }
function fieldHtml(f){
  const id = 'f_' + f.k, v = f.value == null ? '' : f.value;
  if (f.type === 'toggle') return `<div class="fld tg"><label for="${id}">${esc(f.label)}</label><input type="checkbox" id="${id}" ${v ? 'checked' : ''}></div>`;
  if (f.type === 'select') return `<div class="fld"><label for="${id}">${esc(f.label)}</label><select id="${id}">${f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select></div>`;
  if (f.type === 'textarea') return `<div class="fld"><label for="${id}">${esc(f.label)}</label><textarea id="${id}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea></div>`;
  return `<div class="fld"><label for="${id}">${esc(f.label)}</label><input id="${id}" type="${f.type || 'text'}" ${f.type === 'number' ? 'inputmode="numeric" min="0"' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}"></div>`;
}
function openForm(o){
  formCtx = o; scoreCtx = null;
  const rows = []; let pair = [];
  o.fields.forEach(f => { if (f.half) { pair.push(fieldHtml(f)); if (pair.length === 2) { rows.push(`<div class="two">${pair.join('')}</div>`); pair = []; } } else { if (pair.length) { rows.push(`<div class="two">${pair.join('')}</div>`); pair = []; } rows.push(fieldHtml(f)); } });
  if (pair.length) rows.push(`<div class="two">${pair.join('')}</div>`);
  panel.innerHTML = `<div class="sh-head"><h2>${esc(o.title)}</h2><button class="icon-btn" data-act="close" aria-label="Cerrar">×</button></div>
    <form id="frm" novalidate>${rows.join('')}<div class="sh-actions">${o.onDelete ? '<button type="button" class="btn danger" data-act="fdel" id="fdel">Eliminar</button>' : ''}<button type="submit" class="btn primary">${esc(o.saveLabel || 'Guardar')}</button></div></form>`;
  sheet.hidden = false;
}
function readForm(){
  const out = {};
  formCtx.fields.forEach(f => { const el = document.getElementById('f_' + f.k); if (!el) return;
    if (f.type === 'toggle') out[f.k] = el.checked;
    else if (f.type === 'number') out[f.k] = el.value === '' ? null : Number(el.value);
    else out[f.k] = el.value.trim(); });
  return out;
}
function arm(btn, label, fn){
  if (btn.dataset.armed) { fn(); return; }
  btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);
}

let me = null, admins = [];
function makeDb(){
  const cache = () => ADM;
  const up = async (col, id, data) => { const {error} = await sb.from('adm_docs').upsert({col, id, data, updated_at:new Date().toISOString()}); if (error) throw {code:error.code === '54000' ? 'quota_exceeded' : 'error'}; await loadAdmin(); };
  const del = async (col, id) => { const {error} = await sb.from('adm_docs').delete().eq('col', col).eq('id', id); if (error) throw error; await loadAdmin(); };
  const ref = (col, id) => ({
    set: d => up(col, id, d),
    update: d => up(col, id, Object.assign({}, ((cache()[col] || {})[id]) || {}, d)),
    delete: () => del(col, id)
  });
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  return {collection: col => ({doc: id => ref(col, id || newId()), add: d => up(col, newId(), d)}), doc: p => { const i = p.lastIndexOf('/'); return ref(p.slice(0, i), p.slice(i + 1)); }};
}

async function loadState(){
  if (!sb) return;
  if (lastUpd) {
    const r = await sb.from('tb_state').select('updated_at').eq('id', 1).maybeSingle();
    if (r.data && r.data.updated_at === lastUpd) return;
  }
  const {data} = await sb.from('tb_state').select('data,updated_at').eq('id', 1).maybeSingle();
  if (data && data.data) { hasRow = true; lastUpd = data.updated_at; if (JSON.stringify(data.data) !== JSON.stringify(BASE)) setBase(data.data); }
}
async function checkAdmin(){
  isAdmin = false;
  if (sb && me) { const {data} = await sb.rpc('is_admin'); isAdmin = !!data; }
  if (!isAdmin) { editMode = false; placing = false; if (tab === 'admin') tab = 'fixture'; render(); return; }
  db = makeDb(); render();
  if (!hasRow) { const {error} = await sb.from('tb_state').upsert({id:1, data:BASE}); if (!error) hasRow = true; }
  loadAdmin();
}
function loginForm(){
  if (!sb) { toast('Falta conectar la base de datos.'); return; }
  openForm({title:'Acceso organización', saveLabel:'Ingresar', fields:[
    {k:'email', label:'Mail', type:'email', value:''}, {k:'pass', label:'Contraseña', type:'password', value:''},
    {k:'nuevo', label:'Es mi primera vez: crear cuenta', type:'toggle', value:false},
    {k:'olvido', label:'Olvidé mi contraseña (te mando un mail)', type:'toggle', value:false}
  ], onSave: async v => {
    const SITE = location.origin + location.pathname;
    if (v.olvido) {
      if (!v.email) { toast('Poné tu mail.'); return; }
      const {error} = await sb.auth.resetPasswordForEmail(v.email, {redirectTo:SITE});
      if (error) { toast(/rate limit/i.test(error.message) ? 'Ahora no se pueden mandar más mails. Probá en una hora o pedile a Lucas que te cambie la contraseña.' : 'No se pudo mandar el mail: ' + error.message); return; }
      closeSheet(); toast('Te mandamos un mail para elegir una contraseña nueva.'); return;
    }
    if (!v.email || !v.pass) { toast('Completá mail y contraseña.'); return; }
    if (v.nuevo) {
      const {error} = await sb.auth.signUp({email:v.email, password:v.pass, options:{emailRedirectTo:location.origin + location.pathname}});
      if (error) { toast(/password/i.test(error.message) ? 'La contraseña tiene que tener al menos 6 caracteres.' : /registered|exists/i.test(error.message) ? 'Ese mail ya tiene cuenta. Ingresá o usá "Olvidé mi contraseña".' : /rate limit/i.test(error.message) ? 'Ahora no se pueden mandar más mails de confirmación. Pedile a Lucas que te cree la cuenta.' : 'No se pudo crear la cuenta: ' + error.message); return; }
      closeSheet(); toast('Te mandamos un mail para confirmar la cuenta.'); return;
    }
    const {error} = await sb.auth.signInWithPassword({email:v.email, password:v.pass});
    if (error) { toast(/confirm/i.test(error.message) ? 'Tu mail todavía no está confirmado. Revisá tu casilla.' : /invalid/i.test(error.message) ? 'Mail o contraseña incorrectos. Probá con "Olvidé mi contraseña".' : 'No se pudo ingresar: ' + error.message); return; }
    closeSheet();
  }});
}
function newPassForm(){
  openForm({title:'Contraseña nueva', saveLabel:'Guardar', fields:[{k:'p1', label:'Contraseña nueva (mínimo 6)', type:'password', value:''}, {k:'p2', label:'Repetila', type:'password', value:''}],
    onSave: async v => {
      if (!v.p1 || v.p1.length < 6) { toast('Mínimo 6 caracteres.'); return; }
      if (v.p1 !== v.p2) { toast('Las contraseñas no coinciden.'); return; }
      const {error} = await sb.auth.updateUser({password:v.p1});
      if (error) { toast('No se pudo cambiar: ' + error.message); return; }
      closeSheet(); toast('Contraseña actualizada. Ya estás adentro.');
    }});
}
function accessForm(){
  openForm({title:'Accesos al Admin', saveLabel:'Guardar', fields:[{k:'txt', label:'Un mail por línea. Cada persona crea su cuenta con ese mail.', type:'textarea', value:admins.join('\n')}],
    onSave: async v => {
      const want = [...new Set(v.txt.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)))];
      if (me && me.email && !want.includes(me.email.toLowerCase())) want.push(me.email.toLowerCase());
      const add = want.filter(x => !admins.includes(x)), rem = admins.filter(x => !want.includes(x));
      try {
        if (add.length) { const {error} = await sb.from('admins').insert(add.map(email => ({email}))); if (error) throw error; }
        if (rem.length) { const {error} = await sb.from('admins').delete().in('email', rem); if (error) throw error; }
        closeSheet(); toast('Accesos guardados'); loadAdmin();
      } catch (e) { toast('No se pudieron guardar los accesos.'); }
    }});
}
render();
(async function boot(){
  if (!sb) return;
  await loadState();
  const {data:{session}} = await sb.auth.getSession(); me = session ? session.user : null; await checkAdmin();
  if (RECOVERY && me && !recoveryShown) { recoveryShown = true; newPassForm(); }
  sb.auth.onAuthStateChange((ev, session) => {
    const was = me && me.id; me = session ? session.user : null; if ((me && me.id) !== was) checkAdmin(); });
  sb.channel('tb_state').on('postgres_changes', {event:'*', schema:'public', table:'tb_state'}, p => { if (p.new && p.new.data) { hasRow = true; lastUpd = p.new.updated_at; setBase(p.new.data); } }).subscribe();
  setInterval(loadState, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadState(); if (isAdmin) loadAdmin(); } });
})();
setInterval(() => { if (tab === 'agenda' && sheet.hidden) render(); }, 60000);
try { window.matchMedia('(min-width:521px)').addEventListener('change', () => { if (tab === 'tabla') render(); }); } catch (e) {}
})();
</script>
</body></html>
