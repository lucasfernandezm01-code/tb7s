name: Diagnostico escudos
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          URL=$(grep -o "const SB_URL = '[^']*'" index.html | cut -d"'" -f2)
          KEY=$(grep -o "const SB_KEY = '[^']*'" index.html | cut -d"'" -f2)
          curl -sf "$URL/rest/v1/tb_state?select=updated_at,data" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > st.json
          python3 - <<'PY'
          import json
          d=json.load(open('st.json'))[0]; s=d['data']
          print('updated', d['updated_at'])
          print('ESCUDOS', {k: len(v) for k, v in (s.get('escudos') or {}).items()})
          for c in s['comps']: print('COMP', c['id'], [g['equipos'] for g in c['grupos']])
          PY
